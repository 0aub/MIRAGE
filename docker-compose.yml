version: '3.8'

services:
  # Neo4j Graph Database
  neo4j:
    image: neo4j:latest
    container_name: mirage-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"  # Browser interface
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data
    networks:
      - mirage-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant
    container_name: mirage-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - mirage-network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: mirage-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mirage-network

  # Ollama (Local LLM Server) - Professional inference server
  ollama:
    image: ollama/ollama:latest
    container_name: mirage-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - mirage-network
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0

  # TGI-QWEN: DISABLED for single-model testing
  # Uncomment if you need to run multiple models simultaneously
  # tgi-qwen:
  #   image: ghcr.io/huggingface/text-generation-inference:3.3.6
  #   container_name: mirage-tgi-qwen
  #   ports:
  #     - "8766:80"
  #   volumes:
  #     - tgi_data:/data
  #   environment:
  #     MODEL_ID: Qwen/Qwen2.5-7B-Instruct
  #     NUM_SHARD: 1
  #     MAX_INPUT_LENGTH: 4096
  #     MAX_TOTAL_TOKENS: 8192
  #     MAX_BATCH_PREFILL_TOKENS: 4096
  #     PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  #     HF_HUB_ENABLE_HF_TRANSFER: 0
  #     HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_TOKEN}
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   networks:
  #     - mirage-network
  #   restart: unless-stopped
  #   shm_size: '1gb'

  # MIRAGE Backend API
  mirage:
    build: ./mirage
    container_name: mirage-api
    environment:
      PORT: ${API_PORT:-8000}
      DEBUG: ${DEBUG:-True}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # LLM Provider API Keys (at least ONE required for entity extraction)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      # Local LLM via Ollama
      USE_OLLAMA: ${USE_OLLAMA:-false}
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      # Local TGI (Text Generation Inference) endpoint
      USE_TGI: ${USE_TGI:-false}
      TGI_ENDPOINT: ${TGI_ENDPOINT:-http://tgi:80}
      ENTITY_EXTRACTION_ENDPOINT: ${ENTITY_EXTRACTION_ENDPOINT:-http://tgi-qwen:80}
      # Databases (use service names from docker network)
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379
      # CORS
      ALLOWED_ORIGINS: http://localhost:${UI_PORT:-3000},http://ui:${UI_PORT:-3000}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      # Mount source code for hot reload in development
      - ./mirage:/app
      - /app/__pycache__
      # Mount Docker socket for logs streaming
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - neo4j
      - qdrant
      - redis
      # TGI is optional - only needed if USE_TGI=true
      # Uncomment below to make backend wait for TGI
      # - tgi
    networks:
      - mirage-network

  # React UI
  ui:
    build: ./ui
    container_name: mirage-ui
    environment:
      PORT: ${UI_PORT:-3000}
      # API connection - configured in .env.local file (mounted below)
    ports:
      - "${UI_PORT:-3000}:${UI_PORT:-3000}"
    volumes:
      # Mount source code for hot reload in development
      - ./ui:/app
      - /app/node_modules
      - ./ui/.env.local:/app/.env.local
    networks:
      - mirage-network
    depends_on:
      - mirage

volumes:
  neo4j_data:
  qdrant_data:
  redis_data:
  ollama_data:

networks:
  mirage-network:
    driver: bridge
